name: Meridian CI

on:
  pull_request:
  push:
    branches:
      - main
      - phase-1-production-commissioning

concurrency:
  group: meridian-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meridian
      ENCRYPTION_MASTER_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_meridian_ci
      CLERK_SECRET_KEY: sk_test_meridian_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Synchronize branch lockfile
        if: github.event_name == 'push' && github.ref_name == 'phase-1-production-commissioning'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): synchronize package lockfile"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Verify lockfile integrity
        run: git diff --exit-code -- package-lock.json

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Verify deterministic intelligence
        run: npm run verify:intelligence

      - name: Verify source governance and resilience
        run: npm run verify:feeds

      - name: Build application
        run: npm run build
